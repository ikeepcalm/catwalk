plugins {
    id 'java'
    id 'maven-publish'
    id("com.gradleup.shadow") version "9.6.1"
    id("xyz.jpenilla.run-paper") version "3.1.0"
}

group = 'dev.ua.uaproject.catwalk'
version = '0.9-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

configurations {
    testImplementation.extendsFrom compileOnly
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:26.3.build.+")

    compileOnly("org.projectlombok:lombok:1.18.48")
    annotationProcessor("org.projectlombok:lombok:1.18.48")

    implementation("com.google.code.gson:gson:2.15.0")

    // Resolved at runtime by CatWalkLoader, keep versions in sync with it
    compileOnly("io.javalin:javalin:7.2.3")
    compileOnly("io.javalin.community.ssl:javalin-ssl:7.2.3")
    compileOnly("io.javalin.community.openapi:openapi-specification:7.2.3")
    compileOnly("com.fasterxml.jackson.core:jackson-databind:2.22.4")
    compileOnly("com.zaxxer:HikariCP:7.1.0")
    compileOnly("org.mariadb.jdbc:mariadb-java-client:3.5.11")

    testImplementation(platform("org.junit:junit-bom:6.1.3"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(25)
}

test {
    useJUnitPlatform()
}

tasks {
    runServer {
        minecraftVersion("26.3")
    }
}

processResources {
    def props = [version: version]
    inputs.properties(props)
    filteringCharset = 'UTF-8'

    filesMatching('paper-plugin.yml') {
        expand(props)
    }
}

shadowJar {
    archiveClassifier = ''

    relocate 'com.google.gson', 'dev.ua.uaproject.catwalk.libs.gson'
}
