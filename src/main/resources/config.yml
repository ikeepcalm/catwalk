port: 4567
# Public URL of this server, used in the OpenAPI spec
server-url: "http://localhost:4567"
debug: false

useKeyAuth: true
# Generated on first start when left as is; every server of a network must share it
key: 'change_me_to_secure_random_string'
# Extra keys that may only call endpoints whose @BridgeEventHandler scopes they all hold
scoped-keys: {}

# true = hub gateway, false = backend server, "standalone" = no database
hub:
  enabled: false
  server-id: "unknown"

database:
  host: "localhost"
  port: 3306
  name: "catwalk_network"
  username: "catwalk"
  password: "your_secure_password"
  pool-size: 10
  min-idle: 2
  connection-timeout: 30000
  idle-timeout: 600000
  max-lifetime: 1800000

tls:
  enabled: false
  keystore: keystore.jks
  keystorePassword: ""
  sni: false

corsOrigins:
  - "*"

# Only requests from these addresses may set X-Forwarded-For
trusted-proxies: []

request-logging:
  enabled: true

disable-swagger: false

blocked-paths: []

whitelisted-paths:
  - "/swagger"
  - "/swagger.html"
  - "/redoc"
  - "/openapi.json"
